apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

// 允许按需只编译目标 ABI：CI 传 -PtargetAbi=arm64-v8a 后，ndk-build 只编该 ABI，
// 原生编译量降到约 1/4。不传该参数时保持原行为：编译全部 4 个 ABI。
def targetAbis = project.findProperty('targetAbi')?.toString()?.split(',')?.collect { it.trim() }?.findAll { it }

android {
    compileSdkVersion 35
    ndkVersion = "28.0.13004108"
    namespace = "com.termux.terminal"

    defaultConfig {
	minSdkVersion 26
        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters(*(targetAbis ?: ['x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a']))
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.3.0"
    testImplementation "junit:junit:4.13.2"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier.set("sources")
}
