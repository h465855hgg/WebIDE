name: Build APK

# 自动构建 WebIDE 双架构 APK
#
# 触发方式：
#   - push / PR 到 main、master：只构建 1 个变体（arm64-v8a / debug），快速验证
#   - 打 tag（X.Y.Z 或 vX.Y.Z）或手动触发：4 个变体（debug/release × arm64-v8a/armeabi-v7a）全量构建
#   - tag 构建会自动把 APK 发布到 GitHub Release（Release 名称 = tag）
#
# 产物：每个变体一个 artifact；tag 构建会汇总到 Release。
# 发布说明：若仓库里存在 .github/release-notes/<tag>.md，就把它作为 Release 正文
#       （双语格式，见 .trae/skills/release-notes/SKILL.md）；没有则用 --generate-notes。
# 注意：paths-ignore 对 tag 推送同样生效——若发版 tag 指向的提交只改了被忽略的
#       文件（纯文档等），构建与 Release 都不会触发；发版提交务必包含非文档改动
#       （例如 app/build.gradle.kts 里的版本号提升）。
# 说明：app 模块带 arm64-v8a / armeabi-v7a 两个 flavor，任务名必须带 flavor 和模块前缀
#       （如 :app:assembleArm64-v8aDebug），不存在 assembleDebug 这类无 flavor 任务。
#       native 模块支持 -PtargetAbi 只编目标 ABI，CI/本地构建脚本均已传入。

# 注意：空提交（无文件变更）配合 paths-ignore 不会触发本工作流。

on:
  push:
    branches: [main, master]
    # 本项目 tag 约定是 X.Y.Z（无 v 前缀，如 0.3.9 / 0.4.0），
    # 同时兼容 vX.Y.Z 写法；两种都会触发全量构建并发布 Release。
    tags:
      - "*.*.*"
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "screenshots/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 决定本次要构建哪些变体，避免每次 push 都重复 4 份全量编译（冷缓存时单份约 15~20 分钟）
  prepare:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          FULL='{"include":[{"flavor":"arm64-v8a","build_type":"debug","task":"assembleArm64-v8aDebug"},{"flavor":"arm64-v8a","build_type":"release","task":"assembleArm64-v8aRelease"},{"flavor":"armeabi-v7a","build_type":"debug","task":"assembleArmeabi-v7aDebug"},{"flavor":"armeabi-v7a","build_type":"release","task":"assembleArmeabi-v7aRelease"}]}'
          QUICK='{"include":[{"flavor":"arm64-v8a","build_type":"debug","task":"assembleArm64-v8aDebug"}]}'
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"
            echo "构建 4 个变体（debug/release × arm64-v8a/armeabi-v7a）"
          else
            echo "matrix=$QUICK" >> "$GITHUB_OUTPUT"
            echo "仅构建 arm64-v8a / debug（发版 tag 才会全量）"
          fi

  build:
    name: ${{ matrix.flavor }} / ${{ matrix.build_type }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradlew 在 git 中没有可执行位（100644），Linux runner 上直接 ./gradlew 会
      # permission denied，这里统一补上执行权限
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest 镜像自带 Android SDK（cmdline-tools + platform-tools）。
      # 这里补齐项目需要的组件；NDK/CMake 版本与 language-treesitter、webapp
      # 中钉死的版本保持一致，保证可复现。
      # 注意：API 37 属于季度小版本，sdkmanager 包名必须是 platforms;android-37.0，
      #       写成 platforms;android-37 会报 "Failed to find package" 直接失败。
      - name: Set up Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using SDK at: $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      # assemble* 任务属于 :app 模块，必须写成 :app:assembleXxx（早期写成
      # :assembleXxx 会报 "task ... not found in root project 'WebIDE'"）。
      # -PtargetAbi 让 language-treesitter / core:terminal-emulator 只编当前 flavor 需要的
      # 那一个 ABI（否则每个变体都要编 4 个 ABI 的原生库，是耗时大头）。
      - name: Build ${{ matrix.flavor }} (${{ matrix.build_type }})
        run: ./gradlew ":app:${{ matrix.task }}" -PtargetAbi=${{ matrix.flavor }} --console=plain --no-daemon 2>&1 | tee gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webide-${{ matrix.flavor }}-${{ matrix.build_type }}
          path: |
            app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 30

      # release 变体附带 R8 混淆映射，便于线上崩溃还原堆栈
      - name: Upload mapping (release only)
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: webide-${{ matrix.flavor }}-mapping
          path: app/build/outputs/mapping/${{ matrix.flavor }}Release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      # 失败时把 Gradle 日志写进 Job Summary，并以 ::error:: 标注把错误行直接抛到
      # Run 页面“Annotations”，不必翻完整日志即可看到失败原因
      - name: Report build log
        if: failure()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-build.log"
          {
            echo "### ${{ matrix.flavor }} / ${{ matrix.build_type }} — task: \`:app:${{ matrix.task }}\`"
            if [ -f "$LOG" ]; then
              echo "\`gradle-build.log\`: $(wc -l < "$LOG") 行"
              echo "#### 日志后 120 行"
              echo '```text'
              tail -120 "$LOG"
              echo '```'
            else
              echo "**gradle-build.log 不存在**（Build 步骤连 ./gradlew 都没启动）"
            fi
            echo "#### 环境"
            echo '```text'
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "JAVA_HOME=$JAVA_HOME"
            java -version 2>&1 | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          emit() { echo "::error::CI $1"; }
          emit "[info] 构建日志 $(wc -l < "$LOG" 2>/dev/null || echo 0) 行"
          grep -nE "FAILURE:|What went wrong|Caused by:|> Task .+ FAILED|^e: |Execution failed for task|Could not (resolve|determine|find)|SDK location|No toolchains|CMake Error|ninja: build stopped|error:|No such file|Permission denied" \
            "$LOG" 2>/dev/null | head -20 | while IFS= read -r l; do emit "$l"; done
          emit "TAIL=[$(tail -22 "$LOG" 2>/dev/null | tr '\n' '⏎')]"

  # 打 tag（X.Y.Z 或 vX.Y.Z）时把 APK 汇总发布到 GitHub Release
  release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    # gh release create/upload 需要写权限；不显式声明时若仓库默认权限是只读会失败
    # （Settings → Actions → General → Workflow permissions 需为 Read and write）
    permissions:
      contents: write
    steps:
      # 必须 checkout：gh 需要从 git remote 推断仓库，同时发布说明文件也在仓库里
      # （早期没有这一步，gh release create 直接报 "not a git repository" 退出 1）
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ls -lh artifacts/
          # 仓库约定：Release 名称就是 tag 本身（如 0.4.0）
          # 若提交了 .github/release-notes/<tag>.md，则用它作为 Release 正文
          # （双语格式，见 .trae/skills/release-notes/SKILL.md）；否则退回自动生成
          NOTES_FILE=".github/release-notes/${tag}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "使用发布说明文件: $NOTES_FILE"
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "未找到 $NOTES_FILE，改用 --generate-notes"
            NOTES_ARGS=(--generate-notes)
          fi
          # --repo 显式指定，避免依赖当前目录的 git remote
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.apk \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" artifacts/*.apk \
              --title "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              "${NOTES_ARGS[@]}"
          fi
